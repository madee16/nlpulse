[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nlpulse"
version = "0.1.0"
description = "Intelligent NLP-as-a-Service API providing sentiment analysis, NER, zero-shot classification, and text analysis."
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "Portfolio Developer"}
]
keywords = ["fastapi", "nlp", "transformers", "text-analysis", "api"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Framework :: FastAPI",
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "email-validator>=2.0.0",
    "sqlalchemy[asyncio]>=2.0.28",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "python-dotenv>=1.0.1",
    "httpx>=0.27.0",
    "jsonschema>=4.23.0",
    "torch>=2.0.0",
    "numpy>=1.26.0",
    "transformers>=4.38.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "aiosqlite>=0.20.0",
]

[tool.pytest.ini_options]
minversion = "8.0"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --tb=short -m 'not smoke'"
markers = [
    "smoke: opt-in real model smoke tests requiring live internet and model downloads",
    "postgres: opt-in real PostgreSQL 16 integration tests requiring NLPULSE_TEST_POSTGRES_URL",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
